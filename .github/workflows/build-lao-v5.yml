          /// font set on the selection when it is neither (a name from the drawing).
          fn font_choices(current: Option<&str>) -> Vec<String> {
              let mut out: Vec<String> = FAMILIES.iter().map(ToString::to_string).collect();
              for f in cadcraft_fonts::ttf::installed_families() {
                  if !out.iter().any(|o| o.eq_ignore_ascii_case(&f)) {
                      out.push(f);
                  }
              }
              if let Some(c) = current
                  && !out.iter().any(|o| o == c)
              {
                  out.insert(0, c.to_string());
              }
              out
          }'''

          checks = [("loop", loop_re), ("open", open_re), ("close", close_re), ("const", const_re)]
          for name, rx in checks:
              n = len(rx.findall(s))
              if n != 1:
                  print(f"::warning::MTEXT font dropdown NOT applied: pattern '{name}' matched {n} times")
                  sys.exit(1)

          s = loop_re.sub(lambda m: "for fam in font_choices(cur.font.as_deref()) {", s)
          s = open_re.sub(lambda m: m.group(1) + '\n egui::ScrollArea::vertical().id_salt("mtext_font_list").max_height(280.0).show(ui, |ui| {', s)
          s = close_re.sub(lambda m: m.group(1) + "});\n" + m.group(2), s)
          s = const_re.sub(lambda m: m.group(1) + FN, s)
          open(p, "w", encoding="utf-8", newline="\n").write(s)
          print("MTEXT font dropdown applied")
          PY_EOF
          python mtext_edit.py
          git diff --stat
      - name: Lao and Thai letters in the interface (MTEXT box, command line)
        continue-on-error: true
