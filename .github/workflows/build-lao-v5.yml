          import re, sys
          p = "crates/ui-egui/src/theme.rs"
          s = open(p, encoding="utf-8", newline="").read().replace("\r\n", "\n")

          call_re = re.compile(r'(added\.push\(\("system-arabic"\.into\(\), std::sync::Arc::new\(egui::FontData::from_owned\(bytes\)\)\)\);\s*\})')
          const_re = re.compile(r"(const MAX_UI_FONT_BYTES: u64 = 96 \* 1024 \* 1024;)")

          CALL = '''

                  // ລາວ ແລະ ไทย: installed Lao and Thai faces after the others, in every interface language
                  // (egui's bundled faces carry neither, so the MTEXT text box, the command line and names in
                  // those scripts would show boxes).
                  added.extend(
                      lao_thai_fonts()
                          .into_iter()
                          .filter_map(|p| read_capped(&p, MAX_UI_FONT_BYTES))
                          .enumerate()
                          .map(|(i, bytes)| (format!("system-lao-thai-{i}"), std::sync::Arc::new(egui::FontData::from_owned(bytes)))),
                  );'''

          FN = '''

          /// Installed fonts with Lao and Thai letters, for text in those scripts in the interface (the MTEXT
          /// text box, the command line, layer and file names): egui's bundled faces have neither. Phetsarath
          /// OT (the Lao standard) first, then Leelawadee UI and the Noto faces, then other Thai fonts.
          /// Static faces only (the file names below); at most five are loaded.
          #[cfg(not(target_arch = "wasm32"))]
          fn lao_thai_fonts() -> Vec<std::path::PathBuf> {
              let mut dirs: Vec<std::path::PathBuf> = Vec::new();
              if cfg!(windows) {
                  dirs.push("C:\\\\Windows\\\\Fonts".into());
                  if let Some(local) = std::env::var_os("LOCALAPPDATA") {
                      dirs.push(std::path::Path::new(&local).join("Microsoft").join("Windows").join("Fonts"));
                  }
              } else if cfg!(target_os = "macos") {
                  dirs.extend(["/System/Library/Fonts", "/System/Library/Fonts/Supplemental", "/Library/Fonts"].map(std::path::PathBuf::from));
                  if let Some(home) = std::env::var_os("HOME") {
                      dirs.push(std::path::Path::new(&home).join("Library").join("Fonts"));
                  }
              } else {
                  dirs.extend(
                      ["/usr/share/fonts/truetype/noto", "/usr/share/fonts/noto", "/usr/share/fonts/opentype/noto", "/usr/share/fonts/truetype/tlwg", "/usr/local/share/fonts"]
                          .map(std::path::PathBuf::from),
                  );
              }
              const NAMES: &[&str] = &[
                  "Phetsarath_OT.ttf",
                  "PhetsarathOT.ttf",
                  "LeelawUI.ttf",
                  "leelawad.ttf",
                  "NotoSansLao-Regular.ttf",
                  "NotoSansLaoUI-Regular.ttf",
                  "NotoSansThai-Regular.ttf",
                  "NotoSansThaiUI-Regular.ttf",
                  "Saysettha_OT.ttf",
                  "tahoma.ttf",
                  "Thonburi.ttc",
                  "Lao Sangam MN.ttf",
                  "Ayuthaya.ttf",
                  "Loma.ttf",
              ];
              let mut out: Vec<std::path::PathBuf> = Vec::new();
              for name in NAMES {
                  if let Some(found) = dirs.iter().map(|d| d.join(name)).find(|p| p.is_file()) {
                      out.push(found);
                      if out.len() == 5 {
                          break;
                      }
                  }
              }
              out
          }'''

          for name, rx in [("call", call_re), ("const", const_re)]:
              n = len(rx.findall(s))
              if n != 1:
                  print(f"::warning::Lao/Thai UI fonts NOT applied: pattern '{name}' matched {n} times")
                  sys.exit(1)
          s = call_re.sub(lambda m: m.group(1) + CALL, s)
          s = const_re.sub(lambda m: m.group(1) + FN, s)
          open(p, "w", encoding="utf-8", newline="\n").write(s)
          print("Lao/Thai UI fonts applied")
          PY_EOF
          python theme_edit.py
          git diff --stat
      # v4: text typed in the MTEXT box is drawn in the font chosen for it, so the legacy Lao fonts
      # (Alice_0, Alice_1 ...: Latin keys, Lao glyphs) show Lao while typing. Everything above is v3,
      # unchanged. If this step cannot apply, or its code does not compile, the build falls back to v3.
      - name: Alice fonts (legacy Lao) - show typed text in the chosen font
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .pre-alice
          cp crates/fonts/src/ttf.rs .pre-alice/ttf.rs
          cp crates/ui-egui/src/theme.rs .pre-alice/theme.rs
          cp crates/ui-egui/src/mtext_editor.rs .pre-alice/mtext_editor.rs
          cat > legacy_edit.py <<'PY_EOF'
          import sys


          def edit(path, fn):
              s = open(path, encoding="utf-8", newline="").read().replace("\r\n", "\n")
              s = fn(s)
              open(path, "w", encoding="utf-8", newline="\n").write(s)


          def once(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  print(f"::error::legacy Lao fonts NOT applied: '{label}' matched {n} times")
                  sys.exit(1)
              return s.replace(old, new)


          # ---- crates/fonts/src/ttf.rs: the bytes of an installed family ----------------------------------
          TTF_ANCHOR = """pub fn installed_families() -> Vec<String> {
              let mut g = lock();
              g.ensure_families();
              g.family_list.clone()
          }
          """
          TTF_NEW = TTF_ANCHOR + """
          /// The bytes of the installed font file of the family `name` (its first face), for showing text in
          /// that font in the interface. `None` when no installed font has that family.
          pub fn family_bytes(name: &str) -> Option<Vec<u8>> {
              let mut g = lock();
              g.ensure_families();
              let stem = g.family_stems.get(&norm(name))?.clone();
              let bytes = g.file(&stem)?;
              Some(bytes.to_vec())
          }
          """
          edit("crates/fonts/src/ttf.rs", lambda s: once(s, TTF_ANCHOR, TTF_NEW, "installed_families"))

          # ---- crates/ui-egui/src/theme.rs: one egui font family per legacy Lao font ----------------------
          SET_FONTS = "    ctx.set_fonts(fonts);\n}"
          BLOCK = """    // Legacy-encoded Lao fonts (Alice_0, Alice_1, ...): the Latin keys carry Lao glyphs. Each gets a
              // family of its own, so the MTEXT box can show what is typed in the font chosen for it. The
              // interface faces follow in each family, for letters the legacy font lacks.
              {
                  let mut registered: Vec<String> = Vec::new();
                  for fam in cadcraft_fonts::ttf::installed_families() {
                      let low = fam.to_lowercase();
                      if !LEGACY_LAO_PREFIXES.iter().any(|p| low.starts_with(p)) {
                          continue;
                      }
                      let Some(bytes) = cadcraft_fonts::ttf::family_bytes(&fam).filter(|b| (b.len() as u64) <= MAX_UI_FONT_BYTES) else {
                          continue;
                      };
                      let key = format!("legacy-lao-{fam}");
                      fonts.font_data.insert(key.clone(), std::sync::Arc::new(egui::FontData::from_owned(bytes)));
                      let mut list = vec![key];
                      list.extend(fonts.families.get(&FontFamily::Proportional).cloned().unwrap_or_default());
                      fonts.families.insert(FontFamily::Name(fam.as_str().into()), list);
                      registered.push(fam);
                  }
                  *legacy_lao_registry().lock().unwrap_or_else(std::sync::PoisonError::into_inner) = registered;
              }

          """
          MONO = "pub fn mono() -> FontId {\n    FontId::new(12.0, FontFamily::Monospace)\n}\n"
          HELPERS = """
          /// Name prefixes (lower case) of the legacy-encoded Lao fonts, whose Latin keys carry Lao glyphs.
          /// Add the prefix of another such font here.
          const LEGACY_LAO_PREFIXES: &[&str] = &["alice"];

          fn legacy_lao_registry() -> &'static std::sync::Mutex<Vec<String>> {
              static REGISTRY: std::sync::OnceLock<std::sync::Mutex<Vec<String>>> = std::sync::OnceLock::new();
              REGISTRY.get_or_init(|| std::sync::Mutex::new(Vec::new()))
          }

          /// The egui font family that shows text as the font `name` itself, when `name` is a legacy-encoded
          /// Lao font installed on this machine (`install_fonts` makes one family per such font).
          pub(crate) fn legacy_lao_family(name: &str) -> Option<FontFamily> {
              let registry = legacy_lao_registry().lock().unwrap_or_else(std::sync::PoisonError::into_inner);
              registry.iter().find(|n| n.eq_ignore_ascii_case(name)).map(|n| FontFamily::Name(n.as_str().into()))
          }
          """


          def theme(s):
              s = once(s, SET_FONTS, BLOCK + SET_FONTS, "set_fonts")
              s = once(s, MONO, MONO + HELPERS, "mono")
              return s


          edit("crates/ui-egui/src/theme.rs", theme)

          # ---- crates/ui-egui/src/mtext_editor.rs: the text box uses that family ---------------------------
          OLD = "font_id: FontId::proportional(size),"
          NEW = """font_id: crate::theme::legacy_lao_family(f.font.as_deref().unwrap_or(fmt.base_font.as_str()))
                                  .map_or_else(|| FontId::proportional(size), |family| FontId::new(size, family)),"""
          edit("crates/ui-egui/src/mtext_editor.rs", lambda s: once(s, OLD, NEW, "layouter font_id"))
          print("legacy Lao fonts applied")
          PY_EOF
          if python legacy_edit.py; then
            touch .alice-applied
          else
            cp .pre-alice/ttf.rs crates/fonts/src/ttf.rs
            cp .pre-alice/theme.rs crates/ui-egui/src/theme.rs
            cp .pre-alice/mtext_editor.rs crates/ui-egui/src/mtext_editor.rs
            exit 1
          fi
          git diff --stat
      # v5: a double-click on a single-line text (TEXT, attribute definition) opens an Edit Text window with
      # the old text in an ordinary edit field, instead of asking for all of it again on the command line.
      # Steps 1-4 above are v4, unchanged. If this step cannot apply, or its code does not compile, the build
      # falls back to v4 (and from there to v3).
      - name: Edit Text window (double-click on single-line text)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .pre-edit
          cp crates/ui-egui/src/lib.rs .pre-edit/lib.rs
          cp crates/ui-egui/src/dialogs.rs .pre-edit/dialogs.rs
          cp crates/ui-egui/src/canvas/pick.rs .pre-edit/pick.rs
          cp crates/ui-egui/src/theme.rs .pre-edit/theme.rs
          cat > edit_window.py <<'PY_EOF'
          import os
          import re
          import sys


          def read(path):
              return open(path, encoding="utf-8", newline="").read().replace("\r\n", "\n")


          def write(path, s):
              open(path, "w", encoding="utf-8", newline="\n").write(s)


          def fail(label, n):
              print(f"::error::Edit Text window NOT applied: '{label}' matched {n} times")
              sys.exit(1)


          SRC = "crates/ui-egui/src"

          # The font preview row needs the legacy Lao fonts of the Alice step; without it the window is plain.
          theme_src = read(f"{SRC}/theme.rs")
          with_preview = "legacy_lao_family" in theme_src and "legacy_lao_registry" in theme_src

          # ---- theme.rs: the list of legacy Lao fonts, for the preview row ----------------------------------
          if with_preview:
              anchor = 'const LEGACY_LAO_PREFIXES: &[&str] = &["alice"];\n'
              if theme_src.count(anchor) != 1:
                  fail("LEGACY_LAO_PREFIXES", theme_src.count(anchor))
              theme_src = theme_src.replace(anchor, anchor + """
          /// The names of the legacy-encoded Lao fonts installed on this machine, for font pickers.
          pub(crate) fn legacy_lao_families() -> Vec<String> {
              legacy_lao_registry().lock().unwrap_or_else(std::sync::PoisonError.into_inner).clone()
          }
          """.replace("PoisonError.into_inner", "PoisonError::into_inner"))
              write(f"{SRC}/theme.rs", theme_src)

          # ---- lib.rs: the module ---------------------------------------------------------------------------
          lib_src = read(f"{SRC}/lib.rs")
          n = len(re.findall(r"(?m)^mod mtext_editor;$", lib_src))
          if n != 1:
              fail("mod mtext_editor;", n)
          lib_src = re.sub(r"(?m)^mod mtext_editor;$", "mod mtext_editor;\nmod textdlg;", lib_src)
          write(f"{SRC}/lib.rs", lib_src)

          # ---- dialogs.rs: `textedit:<handle>` goes to the window ---------------------------------------------
          dlg_src = read(f"{SRC}/dialogs.rs")
          pat = re.compile(r"(?m)^([ \t]*)other => crate::managers::dialog\(app, ctx, other, &mut open\),$")
          n = len(pat.findall(dlg_src))
          if n != 1:
              fail("managers::dialog arm", n)
          dlg_src = pat.sub(
              lambda m: f'{m.group(1)}o if o.starts_with("textedit:") => crate::textdlg::dialog(app, ctx, o, &mut open),\n{m.group(0)}',
              dlg_src,
          )
          write(f"{SRC}/dialogs.rs", dlg_src)

          # ---- canvas/pick.rs: a double-click on single-line text opens the window ----------------------------
          pick_src = read(f"{SRC}/canvas/pick.rs")
          old = '    app.start("textedit");\n'
          if pick_src.count(old) != 1:
              fail('app.start("textedit")', pick_src.count(old))
          new = """    // Single-line text and attribute definitions open in the Edit Text window, where the old text
              // can be changed with the caret, selection, insert and delete; MTEXT keeps its own editor.
              let single = cadcraft_engine::cmd::curves::pick_at(&app.session, p).and_then(|h| {
                  let e = app.session.doc().ok()?.entity(h)?;
                  matches!(e.kind, EntityKind::Text(_) | EntityKind::AttDef(_)).then_some(h)
              });
              if let Some(h) = single {
                  app.ui.dialog = Some(format!("textedit:{}", h.hex()));
                  return true;
              }
          """
          pick_src = pick_src.replace(old, new + old)
          write(f"{SRC}/canvas/pick.rs", pick_src)

          # ---- textdlg.rs: the window ---------------------------------------------------------------------------
          PICKER = """            let families = crate::theme::legacy_lao_families();
                      if !families.is_empty() {
                          ui.horizontal_wrapped(|ui| {
                              ui.small("Preview font:");
                              if ui.selectable_label(preview.is_empty(), "Default").clicked() {
                                  preview.clear();
                              }
                              for f in &families {
                                  if ui.selectable_label(preview.eq_ignore_ascii_case(f), f.as_str()).clicked() {
                                      preview = f.clone();
                                  }
                              }
                          });
                      }
          """
          FONT = """            if let Some(family) = crate::theme::legacy_lao_family(&preview) {
                          edit = edit.font(egui::FontId::new(20.0, family));
                      }
          """

          TEMPLATE = '''//! Edit Text: the window a double-click on a single-line text opens.
          //!
          //! TEXTEDIT used to take over the command line, where the old text was out of reach and a change
          //! meant typing everything again. The window holds the text in an ordinary edit field (caret,
          //! selection, insert, delete, undo) with OK and Cancel. The engine call is the same (`textedit`
          //! with a handle and the new text), so undo, locked layers and the DXF round trip behave as before.

          use serde_json::json;

          use crate::CadApp;
          use cadcraft_engine::doc::EntityKind;

          /// The text the window starts with.
          fn text_of(k: &EntityKind) -> Option<String> {
              match k {
                  EntityKind::Text(t) => Some(t.value.clone()),
                  EntityKind::AttDef(a) => Some(a.text.value.clone()),
                  _ => None,
              }
          }

          #[derive(Default, Clone)]
          struct State {
              handle: String,
              kind: String,
              text: String,
              /// What the drawing holds now, to tell an edit from a no-op.
              original: String,
              /// The drawing the window was opened for: a handle means nothing once another drawing is active.
              uid: u64,
              message: String,
              focused: bool,
          }

          /// Read the object the window is for. A handle that no longer exists, or an object that is not
          /// text, leaves the window empty instead of failing: the drawing may have changed under it.
          fn initial(app: &CadApp, hex: &str) -> State {
              let uid = app.session.state().map(|s| s.uid).unwrap_or_default();
              let mut st = State { handle: hex.to_string(), uid, ..Default::default() };
              let Some(h) = cadcraft_doc::Handle::parse_hex(hex) else { return st };
              let Ok(d) = app.session.doc() else { return st };
              let Some(e) = d.entity(h) else { return st };
              st.kind = e.kind.type_name().to_string();
              st.text = text_of(&e.kind).unwrap_or_default();
              st.original = st.text.clone();
              st
          }

          /// The Edit Text window for `spec`, which is `textedit:<hex handle>`.
          pub fn dialog(app: &mut CadApp, ctx: &egui::Context, spec: &str, open: &mut bool) {
              let hex = spec.strip_prefix("textedit:").unwrap_or_default().to_string();
              let sid = egui::Id::new(("textedit_state", hex.as_str()));
              let cached: Option<State> = ctx.data_mut(|d| d.get_temp(sid));
              let mut st = match cached {
                  Some(s) => s,
                  None => initial(app, &hex),
              };
              let mut keep = *open;
              let mut commit = false;
              let mut cancel = false;
              let field = egui::Id::new(("textedit_field", st.uid, st.handle.as_str()));
              let pref = egui::Id::new("textedit_preview_font");
              let mut preview: String = ctx.data_mut(|d| d.get_temp::<String>(pref)).unwrap_or_default();
              egui::Window::new("Edit Text")
                  .id(egui::Id::new("textedit_window"))
                  .open(&mut keep)
                  .collapsible(false)
                  .resizable(true)
                  .default_width(440.0)
                  .show(ctx, |ui| {
                      ui.small(format!("{} \\u{b7} {}", st.kind, st.handle));
          @PICKER@            let mut edit = egui::TextEdit::singleline(&mut st.text).id(field).desired_width(f32::INFINITY).hint_text("Text");
          @FONT@            let r = ui.add(edit);
                      if !st.focused {
                          r.request_focus();
                          st.focused = true;
                      }
                      // Enter applies, as in an ordinary one-line field; Escape closes without applying.
                      if r.lost_focus() && ui.input(|i| i.key_pressed(egui::Key::Enter)) {
                          commit = true;
                      }
                      if ui.input(|i| i.key_pressed(egui::Key::Escape)) {
                          cancel = true;
                      }
                      ui.horizontal(|ui| {
                          if ui.button("OK").clicked() {
                              commit = true;
                          }
                          if ui.button("Cancel").clicked() {
                              cancel = true;
                          }
                          ui.small("Enter = OK, Esc = Cancel");
                      });
                      if !st.message.is_empty() {
                          ui.colored_label(ui.visuals().warn_fg_color, st.message.as_str());
                      }
                  });
              if cancel {
                  keep = false;
              }
              if commit {
                  // Typing and undoing back to the same text is not an edit: closing without a command keeps
                  // the undo stack clean.
                  if st.text == st.original {
                      keep = false;
                  } else if app.session.state().map(|s| s.uid).ok() != Some(st.uid) {
                      // The drawing switched while the window sat open: the handle now names another
                      // drawing's object, so the commit is refused.
                      st.message = "The drawing changed. Close the window and open it again.".to_string();
                  } else {
                      let params = json!({ "handles": [st.handle.clone()], "text": st.text });
                      match app.run("textedit", params) {
                          Ok(_) => {
                              st.original = st.text.clone();
                              keep = false;
                          }
                          Err(e) => st.message = e,
                      }
                  }
              }
              *open = keep;
              ctx.data_mut(|d| d.insert_temp(pref, preview));
              // The state lives exactly as long as the window does: a closed window leaves nothing behind,
              // so reopening it reads the drawing's text instead of an edit the user cancelled.
              if keep {
                  ctx.data_mut(|d| d.insert_temp(sid, st));
              } else {
                  ctx.data_mut(|d| {
                      d.remove_temp::<State>(sid);
                      d.remove::<egui::text_edit::TextEditState>(field);
                  });
              }
          }
          '''
          body = TEMPLATE.replace("@PICKER@", PICKER if with_preview else "").replace("@FONT@", FONT if with_preview else "")
          if not with_preview:
              # no font preview: neither the variable nor the field is changed afterwards
              body = body.replace("let mut preview: String =", "let preview: String =")
              body = body.replace("let mut edit = egui::TextEdit", "let edit = egui::TextEdit")
          write(f"{SRC}/textdlg.rs", body)
          print("Edit Text window applied" + (" (with the font preview row)" if with_preview else " (plain)"))
          PY_EOF
          if python edit_window.py; then
            touch .edit-applied
          else
            cp .pre-edit/lib.rs crates/ui-egui/src/lib.rs
            cp .pre-edit/dialogs.rs crates/ui-egui/src/dialogs.rs
            cp .pre-edit/pick.rs crates/ui-egui/src/canvas/pick.rs
            cp .pre-edit/theme.rs crates/ui-egui/src/theme.rs
            rm -f crates/ui-egui/src/textdlg.rs
            exit 1
          fi
          git status --short
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test fonts crate
        continue-on-error: true
        run: cargo test -p cadcraft-fonts
      - name: Build
        shell: bash
        run: |
          set +e
          build() { cargo build --release -p cadcraft 2>&1 | tee "$1"; return "${PIPESTATUS[0]}"; }
          report() {
            echo "::warning::The build with $2 did not compile - building again without it. The errors are in the run summary."
            { echo "### $2: compile errors"; echo '```'; grep -A12 "^error" "$1" | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          }
          build build1.log; rc=$?; last=build1.log
          if [ "$rc" -ne 0 ] && [ -f .edit-applied ]; then
            report "$last" "the Edit Text window patch"
            cp .pre-edit/lib.rs crates/ui-egui/src/lib.rs
            cp .pre-edit/dialogs.rs crates/ui-egui/src/dialogs.rs
            cp .pre-edit/pick.rs crates/ui-egui/src/canvas/pick.rs
            cp .pre-edit/theme.rs crates/ui-egui/src/theme.rs
            rm -f crates/ui-egui/src/textdlg.rs .edit-applied
            build build2.log; rc=$?; last=build2.log
          fi
          if [ "$rc" -ne 0 ] && [ -f .alice-applied ]; then
            report "$last" "the Alice font patch"
            cp .pre-alice/ttf.rs crates/fonts/src/ttf.rs
            cp .pre-alice/theme.rs crates/ui-egui/src/theme.rs
            cp .pre-alice/mtext_editor.rs crates/ui-egui/src/mtext_editor.rs
            rm -f .alice-applied
            build build3.log; rc=$?
          fi
          exit "$rc"
      - name: What is in this build
        if: always()
        shell: bash
        run: |
          mkdir -p out
          if [ -f target/release/cadcraft.exe ]; then cp target/release/cadcraft.exe out/; fi
          has() { if grep -q "$1" "$2" 2>/dev/null; then echo yes; else echo NO; fi; }
          {
            echo "## What is in this build (v5)"
            echo "- Lao shaping, tone marks, font list: $(has installed_families crates/fonts/src/ttf.rs)"
            echo "- Font dropdown in MTEXT: $(has font_choices crates/ui-egui/src/mtext_editor.rs)"
            echo "- Lao/Thai letters in the interface: $(has lao_thai_fonts crates/ui-egui/src/theme.rs)"
            echo "- Alice_0, Alice_1 ... shown in their own font: $(has legacy_lao_family crates/ui-egui/src/mtext_editor.rs)"
            echo "- Edit Text window on double-click (TEXT, attribute definitions): $(has textdlg crates/ui-egui/src/lib.rs)"
          } | tee out/build-info.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-lao-v5
          path: out/
