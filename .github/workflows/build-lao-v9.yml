name: Build Windows LAO v9
run-name: "LAO v9: ${{ github.event.head_commit.message }}"

# Applies the Lao patch to the checked-out source in CI, tests the fonts crate and
# builds cadcraft.exe. The patch is NOT committed; nothing in the repo changes.
# v9 = v8 + a searchable font list (click the font box, type part of a name, the list narrows).
# v8 = v6 stable (command-line caret, Alice fonts, Lao UI) + Edit Text windows:
#   double-click on a single-line TEXT / attribute definition opens an Edit Text window, and a double-click
#   on an MTEXT opens the formatted editor (toolbar, ruler, a font for any selected part) with its own
#   text loaded. The experimental merge of upstream PR 2320 is dropped: it is a 96-file change that does
#   not fit this fork. If a window patch cannot apply or compile, the build falls back without it.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-lao-v9.yml"

jobs:
  stable:
    name: Build (v9 = v8 + searchable font list)
    runs-on: windows-latest
    steps:
      - name: Keep LF line endings (the patch has LF)
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Apply Lao patch
        shell: bash
        run: |
          set -e
          cat > lao.patch <<'PATCH_EOF'
          diff --git a/crates/fonts/src/complex.rs b/crates/fonts/src/complex.rs
