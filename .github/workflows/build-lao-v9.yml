          +/// Most font files whose names are read for the font lists, the largest `name` table read, and
          +/// the most faces read from one collection.
          +const MAX_NAME_FILES: usize = 6_000;
          +const MAX_NAME_TABLE: u32 = 1 << 20;
          +const MAX_NAME_FACES: u32 = 64;
          +
          +/// The family names of the installed fonts, sorted: what a font list in a text dialog offers.
          +/// Read once, from each file's `name` table only (not the whole font). Embedded craft-fonts
          +/// fonts are listed too. Empty where there are no system fonts (the web build).
          +pub fn installed_families() -> Vec<String> {
          +    let mut g = lock();
          +    g.ensure_families();
          +    g.family_list.clone()
          +}
          +
          +fn be16(b: &[u8], at: usize) -> Option<u16> {
          +    let s = b.get(at..at.checked_add(2)?)?;
          +    Some(u16::from_be_bytes([*s.first()?, *s.get(1)?]))
          +}
          +
          +fn be32(b: &[u8], at: usize) -> Option<u32> {
          +    let s = b.get(at..at.checked_add(4)?)?;
          +    Some(u32::from_be_bytes([*s.first()?, *s.get(1)?, *s.get(2)?, *s.get(3)?]))
          +}
          +
          +/// `len` bytes of `f` from offset `at`.
          +fn read_at(f: &mut std::fs::File, at: u64, len: usize) -> Option<Vec<u8>> {
          +    use std::io::{Read, Seek, SeekFrom};
          +    f.seek(SeekFrom::Start(at)).ok()?;
          +    let mut v = vec![0u8; len];
          +    f.read_exact(&mut v).ok()?;
          +    Some(v)
          +}
          +
          +/// The family names of the fonts in a font file (one per face of a collection), read from the
          +/// `name` tables only. Empty for a file that is not a font. Every offset and length is checked.
          +fn file_families(path: &std::path::Path) -> Vec<String> {
          +    let mut out: Vec<String> = Vec::new();
          +    let Ok(mut f) = std::fs::File::open(path) else { return out };
          +    let Some(head) = read_at(&mut f, 0, 12) else { return out };
          +    let offsets: Vec<u64> = if head.get(..4) == Some(b"ttcf".as_slice()) {
          +        let n = usize::try_from(be32(&head, 8).unwrap_or(0).min(MAX_NAME_FACES)).unwrap_or(0);
          +        let Some(table) = read_at(&mut f, 12, n * 4) else { return out };
          +        (0..n).filter_map(|i| be32(&table, i * 4)).map(u64::from).collect()
          +    } else {
          +        vec![0]
          +    };
          +    for off in offsets {
          +        if let Some(name) = face_family(&mut f, off).filter(|n| !out.contains(n)) {
          +            out.push(name);
          +        }
          +    }
          +    out
          +}
          +
          +/// The family name of the font whose table directory is at `off`: the typographic family (name
          +/// id 16) before the plain family (id 1), Windows English before other languages before Mac.
          +fn face_family(f: &mut std::fs::File, off: u64) -> Option<String> {
          +    let dir = read_at(f, off, 12)?;
          +    let tables = usize::from(be16(&dir, 4)?).min(128);
          +    let recs = read_at(f, off.checked_add(12)?, tables * 16)?;
          +    let mut name_table = None;
          +    for i in 0..tables {
          +        let at = i * 16;
          +        if recs.get(at..at + 4) == Some(b"name".as_slice()) {
          +            name_table = Some((be32(&recs, at + 8)?, be32(&recs, at + 12)?));
          +            break;
          +        }
          +    }
          +    let (start, len) = name_table?;
          +    let table = read_at(f, u64::from(start), usize::try_from(len.min(MAX_NAME_TABLE)).ok()?)?;
          +    let count = usize::from(be16(&table, 2)?).min(2048);
          +    let base = usize::from(be16(&table, 4)?);
          +    let mut best: Option<(u8, String)> = None;
          +    for i in 0..count {
          +        let Some((platform, language, id, raw)) = name_record(&table, base, 6 + i * 12) else { continue };
          +        if id != 1 && id != 16 {
          +            continue;
          +        }
          +        let name = match platform {
          +            0 | 3 => {
          +                let units: Vec<u16> = raw.chunks_exact(2).filter_map(|c| be16(c, 0)).collect();
          +                String::from_utf16_lossy(&units)
          +            }
          +            1 => raw.iter().map(|b| char::from(*b)).collect(),
          +            _ => continue,
          +        };
