          import re
          import sys

          SRC = "crates/ui-egui/src"


          def read(path):
              return open(path, encoding="utf-8", newline="").read().replace("\r\n", "\n")


          def write(path, s):
              open(path, "w", encoding="utf-8", newline="\n").write(s)


          def rx(anchor):
              return re.compile(r"\s+".join(re.escape(t) for t in anchor.split()))


          FONTSEARCH = r'''//! A font picker with a search field, like the font boxes of other Windows programs: click it and type
          //! part of a name, the list narrows to the fonts that match; Up and Down move the highlight, Enter or a
          //! click picks, Esc closes. A plain combo box has to be scrolled through every installed family.

          use egui::{Id, Key, Modifiers, Order, Ui};

          /// The choices that match `query`: every word of it is part of the name (any case), names that start
          /// with the query first, the rest in their own order.
          pub(crate) fn matching(choices: &[String], query: &str) -> Vec<String> {
              let q = query.trim().to_lowercase();
              let words: Vec<&str> = q.split_whitespace().collect();
              let mut out: Vec<String> = choices
                  .iter()
                  .filter(|c| {
                      let low = c.to_lowercase();
                      words.iter().all(|w| low.contains(w))
                  })
                  .cloned()
                  .collect();
              if !q.is_empty() {
                  out.sort_by_key(|c| !c.to_lowercase().starts_with(&q));
              }
              out
          }

          #[derive(Clone, Default)]
          struct State {
              query: String,
              open: bool,
              highlight: usize,
          }

          /// The picker: a text field that shows `current` (and becomes the search box when it has the focus) with
          /// an arrow beside it. `choices` is asked for only while the list is open. Returns the name picked in
          /// this frame.
          pub(crate) fn font_combo(ui: &mut Ui, id: Id, current: &str, width: f32, choices: impl FnOnce() -> Vec<String>) -> Option<String> {
              let mut st: State = ui.data_mut(|d| d.get_temp::<State>(id)).unwrap_or_default();
              let mut picked: Option<String> = None;
              let field_id = id.with("field");

              let mut text = if st.open { st.query.clone() } else { current.to_string() };
              let r = ui.add(egui::TextEdit::singleline(&mut text).id(field_id).desired_width(width).hint_text(current.to_string()));
              let arrow = ui.small_button("\u{25be}");

              if r.gained_focus() && !st.open {
                  st.open = true;
                  st.query.clear();
                  st.highlight = 0;
              }
              if arrow.clicked() {
                  st.open = !st.open;
                  st.query.clear();
                  st.highlight = 0;
                  if st.open {
                      ui.memory_mut(|m| m.request_focus(field_id));
                  }
              }
              if r.changed() && st.open {
                  st.query = text;
                  st.highlight = 0;
              }

              if st.open {
                  let list = matching(&choices(), &st.query);
                  let count = list.len();
                  st.highlight = if count == 0 { 0 } else { st.highlight.min(count - 1) };
                  let mut moved = false;
                  if r.has_focus() {
                      if ui.input_mut(|i| i.consume_key(Modifiers::NONE, Key::ArrowDown)) && count > 0 {
                          st.highlight = (st.highlight + 1).min(count - 1);
                          moved = true;
                      }
                      if ui.input_mut(|i| i.consume_key(Modifiers::NONE, Key::ArrowUp)) {
                          st.highlight = st.highlight.saturating_sub(1);
                          moved = true;
                      }
                  }
                  if r.lost_focus() && ui.input(|i| i.key_pressed(Key::Enter)) {
                      picked = list.get(st.highlight).cloned();
                  }

                  let min_w = (r.rect.width() + 20.0).max(220.0);
                  let area = egui::Area::new(id.with("list"))
                      .order(Order::Foreground)
                      .fixed_pos(r.rect.left_bottom())
                      .constrain(true)
                      .show(ui.ctx(), |ui| {
                          egui::Frame::popup(ui.style()).show(ui, |ui| {
                              ui.set_min_width(min_w);
                              egui::ScrollArea::vertical().id_salt("fontlist").max_height(260.0).show(ui, |ui| {
                                  for (i, name) in list.iter().enumerate() {
                                      let resp = ui.selectable_label(i == st.highlight, name.as_str());
                                      if moved && i == st.highlight {
                                          resp.scroll_to_me(None);
                                      }
                                      if resp.clicked() {
                                          picked = Some(name.clone());
                                      }
                                  }
                                  if list.is_empty() {
                                      ui.weak("No font matches");
                                  }
                              });
                          });
                      });

                  let area_rect = area.response.rect;
                  let outside = ui.input(|i| {
                      i.pointer.any_pressed() && i.pointer.interact_pos().is_some_and(|p| !r.rect.contains(p) && !arrow.rect.contains(p) && !area_rect.contains(p))
                  });
                  let escape = ui.input_mut(|i| i.consume_key(Modifiers::NONE, Key::Escape));
                  if outside || escape || picked.is_some() {
                      st.open = false;
                      st.query.clear();
                      st.highlight = 0;
                      if r.has_focus() {
                          ui.memory_mut(|m| m.surrender_focus(field_id));
                      }
                  }
              }
              ui.data_mut(|d| d.insert_temp(id, st));
              picked
          }
          '''

