          STRUCT = """pub buffer: String,
              /// The caret in `buffer` (a char index) and the text it was set for. When anything other than
              /// the editing keys changes the buffer, the caret goes to its end.
              caret: usize,
              caret_buf: String,
              /// The prompt (message and default) whose old text was already put in the line.
              prefilled: String,"""

          METHODS = """impl CmdLine {
              /// The caret as a char index into the buffer; at the end whenever something else changed the buffer.
              pub fn caret_at(&mut self) -> usize {
                  let n = self.buffer.chars().count();
                  if self.caret_buf != self.buffer {
                      self.caret = n;
                      self.caret_buf.clone_from(&self.buffer);
                  }
                  self.caret = self.caret.min(n);
                  self.caret
              }

              fn set_caret(&mut self, at: usize) {
                  self.caret = at.min(self.buffer.chars().count());
                  self.caret_buf.clone_from(&self.buffer);
              }

              /// Insert `s` at the caret (typing in the middle of the line).
              pub fn insert_at_caret(&mut self, s: &str) {
                  let at = self.caret_at();
                  let byte = self.buffer.char_indices().nth(at).map_or(self.buffer.len(), |(i, _)| i);
                  self.buffer.insert_str(byte, s);
                  self.set_caret(at + s.chars().count());
              }

              /// Erase the letter before the caret (`back`) or the one after it.
              pub fn erase_at_caret(&mut self, back: bool) {
                  let at = self.caret_at();
                  let Some(del) = (if back { at.checked_sub(1) } else { Some(at) }) else { return };
                  if let Some((i, c)) = self.buffer.char_indices().nth(del) {
                      self.buffer.replace_range(i..i + c.len_utf8(), "");
                      self.set_caret(del);
                  }
              }
          """

          KEYS = """Key::ArrowLeft if !modifiers.any() && !app.cmd.buffer.is_empty() => {
                              let at = app.cmd.caret_at();
                              app.cmd.set_caret(at.saturating_sub(1));
                          }
                          Key::ArrowRight if !modifiers.any() && !app.cmd.buffer.is_empty() => {
                              let at = app.cmd.caret_at();
                              app.cmd.set_caret(at + 1);
                          }
                          Key::Home if !app.cmd.buffer.is_empty() => app.cmd.set_caret(0),
                          Key::End if !app.cmd.buffer.is_empty() => {
                              let n = app.cmd.buffer.chars().count();
                              app.cmd.set_caret(n);
                          }
                          Key::Delete if !app.cmd.buffer.is_empty() => app.cmd.erase_at_caret(false),
                          Key::Tab => tab(app),"""

          PREFILL = """options_still_fit(app);

              // "Enter new text <old text>": start with the old text in the line, so letters can be inserted
              // or erased inside it (arrows, Home, End, Delete) instead of retyping all of it.
              let old_text = app
                  .session
                  .current_prompt()
                  .filter(|p| p.accept.text && !p.accept.point && !p.accept.number && !p.raw && p.message.starts_with("Enter new text"))
                  .and_then(|p| p.default.as_ref().map(ToString::to_string).filter(|d| !d.is_empty()).map(|d| format!("{}|{d}", p.message)));
              match old_text {
                  Some(key) => {
                      if app.cmd.prefilled != key {
                          if app.cmd.buffer.is_empty()
                              && let Some((_, d)) = key.split_once('|')
                          {
                              app.cmd.buffer = d.to_string();
                          }
                          app.cmd.prefilled = key;
                      }
                  }
                  None => {
                      if !app.session.prompting() {
                          app.cmd.prefilled.clear();
                      }
                  }
              }"""

          CARET_X = """let at = app.cmd.caret_at();
              let before: String = app.cmd.buffer.chars().take(at).collect();
              let mut caret_x = x + if before.len() == app.cmd.buffer.len() { gw } else { p.layout_no_wrap(before, font.clone(), t.text).size().x };"""

          edits = [
              ("pub buffer: String,", STRUCT),
              ("impl CmdLine {", METHODS),
              ("app.cmd.buffer.push_str(&t);", "app.cmd.insert_at_caret(&t);"),
              ("app.cmd.buffer.push_str(&text);", "app.cmd.insert_at_caret(&text);"),
              ("app.cmd.buffer.pop();", "app.cmd.erase_at_caret(true);"),
              ("Key::Tab => tab(app),", KEYS),
              ("options_still_fit(app);", PREFILL),
              ("let mut caret_x = x + gw;", CARET_X),
          ]
          for anchor, new in edits:
              n = len(rx(anchor).findall(s))
              if n != 1:
                  print(f"::warning::command-line caret NOT applied: '{anchor}' matched {n} times")
                  sys.exit(1)
          for anchor, new in edits:
              s = rx(anchor).sub(lambda m, new=new: new, s)
          open(p, "w", encoding="utf-8", newline="\n").write(s)
          print("command-line caret applied")
          PY_EOF
          if python caret_edit.py; then
            touch .caret-applied
          else
            cp .pre-caret/cmdline.rs crates/ui-egui/src/cmdline.rs
            exit 1
          fi
          git diff --stat
