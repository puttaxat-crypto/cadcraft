          SRC = "crates/ui-egui/src"

          # ---- mtext_editor.rs: the contents parser and the window -----------------------------------------
          NEW_CODE = r'''/// The font codes in force over a run of MTEXT characters.
          #[derive(Clone, Default, PartialEq)]
          struct FontState {
              font: Option<String>,
              bold: bool,
              italic: bool,
              underline: bool,
              overline: bool,
          }

          /// Split MTEXT contents into plain text (a newline for each `\P`) and the runs of it whose font
          /// codes differ from the default, as (first char, end char, codes). `None` when the contents use
          /// codes the editor cannot show (stacked fractions, colours, heights, ...): those keep the command
          /// line, so nothing is lost by editing.
          fn parse_contents(src: &str) -> Option<(String, Vec<(usize, usize, FontState)>)> {
              let chars: Vec<char> = src.chars().collect();
              let mut out: Vec<(char, FontState)> = Vec::new();
              let mut cur = FontState::default();
              let mut stack: Vec<FontState> = Vec::new();
              let mut i = 0;
              while i < chars.len() {
                  match chars[i] {
                      '{' => {
                          stack.push(cur.clone());
                          i += 1;
                      }
                      '}' => {
                          cur = stack.pop()?;
                          i += 1;
                      }
                      '\\' => {
                          let k = *chars.get(i + 1)?;
                          match k {
                              '\\' | '{' | '}' => {
                                  out.push((k, cur.clone()));
                                  i += 2;
                              }
                              'P' => {
                                  out.push(('\n', cur.clone()));
                                  i += 2;
                              }
                              'L' => {
                                  cur.underline = true;
                                  i += 2;
                              }
                              'l' => {
                                  cur.underline = false;
                                  i += 2;
                              }
                              'O' => {
                                  cur.overline = true;
                                  i += 2;
                              }
                              'o' => {
                                  cur.overline = false;
                                  i += 2;
                              }
                              'f' => {
                                  // \fName|b0|i0|c0|p0; : the charset and pitch parts carry nothing here.
                                  let end = i + 2 + chars[i + 2..].iter().position(|&c| c == ';')?;
                                  let spec: String = chars[i + 2..end].iter().collect();
                                  let mut parts = spec.split('|');
                                  let name = parts.next().unwrap_or_default();
                                  cur.font = (!name.is_empty()).then(|| name.to_string());
                                  cur.bold = false;
                                  cur.italic = false;
                                  for part in parts {
                                      if let Some(v) = part.strip_prefix('b') {
                                          cur.bold = v != "0";
                                      } else if let Some(v) = part.strip_prefix('i') {
                                          cur.italic = v != "0";
                                      }
                                  }
                                  i = end + 1;
                              }
                              _ => return None,
                          }
                      }
                      c => {
                          out.push((c, cur.clone()));
                          i += 1;
                      }
                  }
              }
              let plain: String = out.iter().map(|(c, _)| *c).collect();
              let mut runs = Vec::new();
              let mut s = 0;
              for k in 1..=out.len() {
                  if k == out.len() || out[k].1 != out[s].1 {
                      if out[s].1 != FontState::default() {
                          runs.push((s, k, out[s].1.clone()));
                      }
                      s = k;
                  }
              }
              Some((plain, runs))
          }

          /// Whether an MTEXT's contents can be edited in the formatted editor window.
          pub(crate) fn can_edit_rich(contents: &str) -> bool {
              parse_contents(contents).is_some_and(|(plain, _)| !plain.is_empty())
          }

          /// An existing MTEXT open in the editor window.
          #[derive(Clone)]
          struct Existing {
              st: State,
              /// The contents as the editor writes them before any change, to tell an edit from a no-op.
              initial: String,
              /// The drawing the window was opened for: a handle means nothing once another drawing is active.
              uid: u64,
              base_h: f64,
              message: String,
              focused: bool,
          }

          /// Load the MTEXT with handle `hex` into the editor: its text, and the font of each part.
          fn load_existing(app: &CadApp, hex: &str) -> Option<Existing> {
              let uid = app.session.state().map(|s| s.uid).unwrap_or_default();
              let h = cadcraft_doc::Handle::parse_hex(hex)?;
              let d = app.session.doc().ok()?;
              let e = d.entity(h)?;
              let cadcraft_engine::doc::EntityKind::MText(t) = &e.kind else { return None };
              let (plain, runs) = parse_contents(&t.contents)?;
              let mut fmt = Formatted::default();
              if let Some(f) = d.text_style(&t.style).map(|s| s.font.clone()) {
                  // A family name, not a font file (`txt.shx`, `arial.ttf`).
                  if !f.is_empty() && !f.contains('.') {
                      fmt.base_font = f;
                  }
              }
              fmt.set_text(&plain, &CharFmt::default());
              for (a, b, s) in runs {
                  let (font, bold, italic, underline, overline) = (s.font.clone(), s.bold, s.italic, s.underline, s.overline);
                  fmt.edit(a..b, |c| {
                      if font.is_some() {
                          c.font = font.clone();
                      }
                      c.bold = bold;
                      c.italic = italic;
                      c.underline = underline;
                      c.overline = overline;
                  });
              }
              let initial = fmt.to_contents();
              let base_h = if t.height > 0.0 { t.height } else { 0.2 };
              let st = State { fmt, typing: CharFmt::default(), typing_at: 0, top: 70.0, sel: (0, 0), caret: None };
              Some(Existing { st, initial, uid, base_h, message: String::new(), focused: false })
          }

          /// Edit an existing MTEXT in a window (`spec` is `mtextedit:<hex handle>`): the toolbar, ruler and
          /// formatted text box of the in-place editor, loaded with the text's own contents. Characters can
          /// be inserted or deleted anywhere, and the font of any selected part changed.
          pub fn edit_existing(app: &mut CadApp, ctx: &egui::Context, spec: &str, open: &mut bool) {
              let hex = spec.strip_prefix("mtextedit:").unwrap_or_default().to_string();
              let sid = egui::Id::new(("mtext_existing_state", hex.as_str()));
              let cached: Option<Existing> = ctx.data_mut(|d| d.get_temp(sid));
              let Some(mut ex) = cached.or_else(|| load_existing(app, &hex)) else {
                  *open = false;
                  return;
              };
              let t = Tokens::get();
              let px = 22.0_f32;
              let width = 560.0_f32;
              let base_h = ex.base_h;
              let mut keep = *open;
              let mut done = Done::No;
              egui::Window::new("Edit MTEXT").id(egui::Id::new("mtext_existing_window")).open(&mut keep).collapsible(false).resizable(false).show(ctx, |ui| {
                  ui.set_width(width);
                  toolbar(ui, &mut ex.st, base_h);
                  ruler(ui, &mut ex.st, px, width, base_h);
                  text_box(ui, &mut ex.st, base_h, px, width, &t);
                  if !ex.focused {
                      ui.ctx().memory_mut(|m| m.request_focus(edit_id()));
                      ex.focused = true;
                  }
                  ui.horizontal(|ui| {
                      ui.add_space(4.0);
                      if ui.button(crate::tl!("OK")).clicked() {
                          done = Done::Ok;
                      }
                      if ui.button(crate::tl!("Cancel")).clicked() {
                          done = Done::Cancel;
                      }
                      let finish = if ui.ctx().os().is_mac() { crate::tl!("⌘↩ to finish") } else { crate::tl!("Ctrl+Enter to finish") };
                      ui.label(RichText::new(finish).small().color(t.text_dim));
                  });
                  if !ex.message.is_empty() {
                      ui.colored_label(ui.visuals().warn_fg_color, ex.message.as_str());
                  }
              });
              if ctx.input(|i| i.key_pressed(egui::Key::Escape)) {
                  done = Done::Cancel;
              } else if ctx.input(|i| i.modifiers.command && i.key_pressed(egui::Key::Enter)) {
                  done = Done::Ok;
              }
              let mut close = !keep;
              match done {
                  Done::No => {}
                  Done::Cancel => close = true,
                  Done::Ok => {
                      let contents = ex.st.fmt.to_contents();
                      if ex.st.fmt.is_empty() {
                          ex.message = "The text is empty.".to_string();
                      } else if contents == ex.initial {
                          // Typing and undoing back to the same text is not an edit: no command, so the undo
                          // stack stays clean.
                          close = true;
                      } else if app.session.state().map(|s| s.uid).ok() != Some(ex.uid) {
                          // The drawing switched while the window sat open: the handle now names another
                          // drawing's object, so the commit is refused.
                          ex.message = "The drawing changed. Close the window and open it again.".to_string();
                      } else {
                          match app.run("textedit", serde_json::json!({ "handles": [hex.clone()], "text": contents })) {
                              Ok(_) => close = true,
                              Err(e) => ex.message = e,
                          }
                      }
                  }
              }
              *open = !close;
              if close {
                  // Nothing is kept: reopening reads the drawing's text, not an edit the user cancelled, and
                  // the text box starts without the last text's caret and undo history.
                  ctx.data_mut(|d| {
                      d.remove::<Existing>(sid);
                      d.remove::<egui::text_edit::TextEditState>(edit_id());
                  });
              } else {
                  ctx.data_mut(|d| d.insert_temp(sid, ex));
              }
          }

          '''

