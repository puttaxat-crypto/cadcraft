          pub(crate) fn legacy_lao_families() -> Vec<String> {
              legacy_lao_registry().lock().unwrap_or_else(std::sync::PoisonError.into_inner).clone()
          }
          """.replace("PoisonError.into_inner", "PoisonError::into_inner"))
              write(f"{SRC}/theme.rs", theme_src)

          # ---- lib.rs: the module ---------------------------------------------------------------------------
          lib_src = read(f"{SRC}/lib.rs")
          n = len(re.findall(r"(?m)^mod mtext_editor;$", lib_src))
