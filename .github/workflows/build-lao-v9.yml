                          if ui.selectable_label(c == v, c).clicked() && c != v {
                              picked = Some(c.clone());
                          }
                      }
                  });
              });
          }"""

          MTEXT_RE = re.compile(
              r'craft_ui::ComboBox::from_id_salt\("mtext_font"\).*?\.accessible_name\(crate::tl!\("Font"\)\);',
              re.S,
          )
          MTEXT_NEW = """if let Some(fam) = crate::fontsearch::font_combo(ui, egui::Id::new("mtext_font_combo"), &shown, 150.0, || font_choices(cur.font.as_deref())) {
                  change(st, |c| c.font = Some(fam.clone()));
                  refocus = true;
              }"""

          applied = []

          # lib.rs: the module
          lib = read(f"{SRC}/lib.rs")
          if len(LIST_RE.findall(lib)) != 1:
              print(f"::error::Searchable font list NOT applied: 'mod mtext_editor;' matched {len(LIST_RE.findall(lib))} times")
              sys.exit(1)
          lib = LIST_RE.sub(lambda m: "mod fontsearch;\n" + m.group(0), lib)

          # managers.rs: Text Style (and any other long choice list)
          managers_path = f"{SRC}/managers.rs"
          managers = read(managers_path)
          pat = rx(MANAGERS_OLD)
          new_managers = None
          if len(pat.findall(managers)) == 1:
              new_managers = pat.sub(lambda m: MANAGERS_NEW, managers)
              applied.append("Text Style")
          else:
              print(f"::warning::Searchable font list: Text Style anchor matched {len(pat.findall(managers))} times, skipped")

          # mtext_editor.rs: the MTEXT toolbar
          mtext_path = f"{SRC}/mtext_editor.rs"
          mtext = read(mtext_path)
          new_mtext = None
          if len(MTEXT_RE.findall(mtext)) == 1:
              new_mtext = MTEXT_RE.sub(lambda m: MTEXT_NEW, mtext)
              applied.append("MTEXT toolbar")
          else:
              print(f"::warning::Searchable font list: MTEXT toolbar anchor matched {len(MTEXT_RE.findall(mtext))} times, skipped")

          if not applied:
              sys.exit(1)

          write(f"{SRC}/lib.rs", lib)
          write(f"{SRC}/fontsearch.rs", FONTSEARCH)
          if new_managers is not None:
              write(managers_path, new_managers)
          if new_mtext is not None:
              write(mtext_path, new_mtext)
          print("Searchable font list applied: " + ", ".join(applied))
          PY_EOF
          if python search_edit.py; then
            touch .search-applied
          else
            cp .pre-search/lib.rs crates/ui-egui/src/lib.rs
            cp .pre-search/managers.rs crates/ui-egui/src/managers.rs
            cp .pre-search/mtext_editor.rs crates/ui-egui/src/mtext_editor.rs
            rm -f crates/ui-egui/src/fontsearch.rs
            exit 1
          fi
          git status --short
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test fonts crate
        continue-on-error: true
        run: cargo test -p cadcraft-fonts
      - name: Build
        shell: bash
        run: |
          set +e
          export CARGO_TERM_COLOR=never
          build() { cargo build --release -p cadcraft 2>&1 | tee "$1"; return "${PIPESTATUS[0]}"; }
          report() {
            echo "::warning::The build with $2 did not compile - building again without it. The errors are in the run summary."
            { echo "### $2: compile errors"; echo '```'; sed 's/\x1b\[[0-9;]*m//g' "$1" | grep -A14 "^error" | head -90; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          }
          n=1; build build1.log; rc=$?; last=build1.log
          drop() {
            case "$1" in
              search) cp .pre-search/lib.rs crates/ui-egui/src/lib.rs; cp .pre-search/managers.rs crates/ui-egui/src/managers.rs; cp .pre-search/mtext_editor.rs crates/ui-egui/src/mtext_editor.rs; rm -f crates/ui-egui/src/fontsearch.rs ;;
              mtext) cp .pre-mtext/mtext_editor.rs crates/ui-egui/src/mtext_editor.rs; cp .pre-mtext/dialogs.rs crates/ui-egui/src/dialogs.rs; cp .pre-mtext/pick.rs crates/ui-egui/src/canvas/pick.rs ;;
              edit) cp .pre-edit/lib.rs crates/ui-egui/src/lib.rs; cp .pre-edit/dialogs.rs crates/ui-egui/src/dialogs.rs; cp .pre-edit/pick.rs crates/ui-egui/src/canvas/pick.rs; cp .pre-edit/theme.rs crates/ui-egui/src/theme.rs; rm -f crates/ui-egui/src/textdlg.rs ;;
              caret) cp .pre-caret/cmdline.rs crates/ui-egui/src/cmdline.rs ;;
              alice) cp .pre-alice/ttf.rs crates/fonts/src/ttf.rs; cp .pre-alice/theme.rs crates/ui-egui/src/theme.rs; cp .pre-alice/mtext_editor.rs crates/ui-egui/src/mtext_editor.rs ;;
            esac
            rm -f ".$1-applied"
          }
          for s in search mtext edit caret alice; do
            if [ "$rc" -ne 0 ] && [ -f ".$s-applied" ]; then
              report "$last" "the $s patch"
              drop "$s"
              n=$((n+1)); last="build$n.log"; build "$last"; rc=$?
            fi
          done
          exit "$rc"
      - name: What is in this build
        if: always()
        shell: bash
        run: |
          mkdir -p out
          if [ -f target/release/cadcraft.exe ]; then cp target/release/cadcraft.exe out/; fi
          has() { if grep -q "$1" "$2" 2>/dev/null; then echo yes; else echo NO; fi; }
          {
            echo "## What is in this build (v9)"
            echo "- Lao shaping, tone marks, font list: $(has installed_families crates/fonts/src/ttf.rs)"
            echo "- Font dropdown in MTEXT: $(has font_choices crates/ui-egui/src/mtext_editor.rs)"
            echo "- Lao/Thai letters in the interface: $(has lao_thai_fonts crates/ui-egui/src/theme.rs)"
            echo "- Alice_0, Alice_1 ... shown in their own font: $(has legacy_lao_family crates/ui-egui/src/mtext_editor.rs)"
            echo "- Command line: caret, insert/erase inside the text: $(has insert_at_caret crates/ui-egui/src/cmdline.rs)"
            echo "- Edit Text window (TEXT, attribute definitions): $(has textdlg crates/ui-egui/src/lib.rs)"
            echo "- MTEXT editor window (existing MTEXT): $(has edit_existing crates/ui-egui/src/mtext_editor.rs)"
            echo "- Searchable font list (type to filter): $(has font_combo crates/ui-egui/src/fontsearch.rs)"
          } | tee out/build-info.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-lao-v9
          path: out/
