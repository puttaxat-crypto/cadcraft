          loop_re = re.compile(r"for fam in FAMILIES\s*\.iter\(\)\s*\.map\(ToString::to_string\)\s*\.chain\(\s*cur\.font\s*\.clone\(\)\s*\.filter\(\|f\| !FAMILIES\.contains\(&f\.as_str\(\)\)\)\s*\)\s*\{")
          open_re = re.compile(r"(\.selected_text\(shown\.clone\(\)\)\s*\.show_ui\(ui, \|ui\| \{)")
          close_re = re.compile(r"(refocus = true;\s*\}\s*\}\s*)(\}\)\s*\.response\s*\.accessible_name\(crate::tl!\(\"Font\"\)\))")
          const_re = re.compile(r"(const FAMILIES: \[&str; \d+\] = \[[^\]]*\];)")

          FN = '''

          /// The MTEXT font list: the common families, then every installed family (A to Z), and the
          /// font set on the selection when it is neither (a name from the drawing).
          fn font_choices(current: Option<&str>) -> Vec<String> {
              let mut out: Vec<String> = FAMILIES.iter().map(ToString::to_string).collect();
              for f in cadcraft_fonts::ttf::installed_families() {
                  if !out.iter().any(|o| o.eq_ignore_ascii_case(&f)) {
                      out.push(f);
                  }
              }
              if let Some(c) = current
                  && !out.iter().any(|o| o == c)
              {
                  out.insert(0, c.to_string());
              }
              out
          }'''

          checks = [("loop", loop_re), ("open", open_re), ("close", close_re), ("const", const_re)]
          for name, rx in checks:
              n = len(rx.findall(s))
              if n != 1:
                  print(f"::warning::MTEXT font dropdown NOT applied: pattern '{name}' matched {n} times")
                  sys.exit(1)

          s = loop_re.sub(lambda m: "for fam in font_choices(cur.font.as_deref()) {", s)
          s = open_re.sub(lambda m: m.group(1) + '\n egui::ScrollArea::vertical().id_salt("mtext_font_list").max_height(280.0).show(ui, |ui| {', s)
          s = close_re.sub(lambda m: m.group(1) + "});\n" + m.group(2), s)
          s = const_re.sub(lambda m: m.group(1) + FN, s)
          open(p, "w", encoding="utf-8", newline="\n").write(s)
          print("MTEXT font dropdown applied")
          PY_EOF
          python mtext_edit.py
          git diff --stat
      - name: Lao and Thai letters in the interface (MTEXT box, command line)
        continue-on-error: true
        shell: bash
        run: |
          cat > theme_edit.py <<'PY_EOF'
          import re, sys
          p = "crates/ui-egui/src/theme.rs"
          s = open(p, encoding="utf-8", newline="").read().replace("\r\n", "\n")

          call_re = re.compile(r'(added\.push\(\("system-arabic"\.into\(\), std::sync::Arc::new\(egui::FontData::from_owned\(bytes\)\)\)\);\s*\})')
          const_re = re.compile(r"(const MAX_UI_FONT_BYTES: u64 = 96 \* 1024 \* 1024;)")

          CALL = '''

                  // ລາວ ແລະ ไทย: installed Lao and Thai faces after the others, in every interface language
                  // (egui's bundled faces carry neither, so the MTEXT text box, the command line and names in
                  // those scripts would show boxes).
                  added.extend(
                      lao_thai_fonts()
                          .into_iter()
                          .filter_map(|p| read_capped(&p, MAX_UI_FONT_BYTES))
                          .enumerate()
                          .map(|(i, bytes)| (format!("system-lao-thai-{i}"), std::sync::Arc::new(egui::FontData::from_owned(bytes)))),
                  );'''

          FN = '''

          /// Installed fonts with Lao and Thai letters, for text in those scripts in the interface (the MTEXT
          /// text box, the command line, layer and file names): egui's bundled faces have neither. Phetsarath
          /// OT (the Lao standard) first, then Leelawadee UI and the Noto faces, then other Thai fonts.
          /// Static faces only (the file names below); at most five are loaded.
          #[cfg(not(target_arch = "wasm32"))]
          fn lao_thai_fonts() -> Vec<std::path::PathBuf> {
              let mut dirs: Vec<std::path::PathBuf> = Vec::new();
              if cfg!(windows) {
                  dirs.push("C:\\\\Windows\\\\Fonts".into());
                  if let Some(local) = std::env::var_os("LOCALAPPDATA") {
                      dirs.push(std::path::Path::new(&local).join("Microsoft").join("Windows").join("Fonts"));
                  }
              } else if cfg!(target_os = "macos") {
                  dirs.extend(["/System/Library/Fonts", "/System/Library/Fonts/Supplemental", "/Library/Fonts"].map(std::path::PathBuf::from));
                  if let Some(home) = std::env::var_os("HOME") {
                      dirs.push(std::path::Path::new(&home).join("Library").join("Fonts"));
                  }
              } else {
                  dirs.extend(
                      ["/usr/share/fonts/truetype/noto", "/usr/share/fonts/noto", "/usr/share/fonts/opentype/noto", "/usr/share/fonts/truetype/tlwg", "/usr/local/share/fonts"]
                          .map(std::path::PathBuf::from),
                  );
              }
              const NAMES: &[&str] = &[
                  "Phetsarath_OT.ttf",
                  "PhetsarathOT.ttf",
                  "LeelawUI.ttf",
                  "leelawad.ttf",
                  "NotoSansLao-Regular.ttf",
                  "NotoSansLaoUI-Regular.ttf",
                  "NotoSansThai-Regular.ttf",
                  "NotoSansThaiUI-Regular.ttf",
                  "Saysettha_OT.ttf",
                  "tahoma.ttf",
                  "Thonburi.ttc",
                  "Lao Sangam MN.ttf",
                  "Ayuthaya.ttf",
                  "Loma.ttf",
              ];
              let mut out: Vec<std::path::PathBuf> = Vec::new();
              for name in NAMES {
                  if let Some(found) = dirs.iter().map(|d| d.join(name)).find(|p| p.is_file()) {
                      out.push(found);
                      if out.len() == 5 {
                          break;
                      }
                  }
              }
              out
          }'''

          for name, rx in [("call", call_re), ("const", const_re)]:
              n = len(rx.findall(s))
              if n != 1:
                  print(f"::warning::Lao/Thai UI fonts NOT applied: pattern '{name}' matched {n} times")
                  sys.exit(1)
          s = call_re.sub(lambda m: m.group(1) + CALL, s)
          s = const_re.sub(lambda m: m.group(1) + FN, s)
          open(p, "w", encoding="utf-8", newline="\n").write(s)
          print("Lao/Thai UI fonts applied")
          PY_EOF
          python theme_edit.py
          git diff --stat
      # v4: text typed in the MTEXT box is drawn in the font chosen for it, so the legacy Lao fonts
      # (Alice_0, Alice_1 ...: Latin keys, Lao glyphs) show Lao while typing. Everything above is v3,
      # unchanged. If this step cannot apply, or its code does not compile, the build falls back to v3.
      - name: Alice fonts (legacy Lao) - show typed text in the chosen font
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .pre-alice
          cp crates/fonts/src/ttf.rs .pre-alice/ttf.rs
          cp crates/ui-egui/src/theme.rs .pre-alice/theme.rs
          cp crates/ui-egui/src/mtext_editor.rs .pre-alice/mtext_editor.rs
          cat > legacy_edit.py <<'PY_EOF'
          import sys


          def edit(path, fn):
              s = open(path, encoding="utf-8", newline="").read().replace("\r\n", "\n")
              s = fn(s)
              open(path, "w", encoding="utf-8", newline="\n").write(s)


          def once(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  print(f"::error::legacy Lao fonts NOT applied: '{label}' matched {n} times")
                  sys.exit(1)
              return s.replace(old, new)


          # ---- crates/fonts/src/ttf.rs: the bytes of an installed family ----------------------------------
          TTF_ANCHOR = """pub fn installed_families() -> Vec<String> {
              let mut g = lock();
              g.ensure_families();
              g.family_list.clone()
          }
          """
          TTF_NEW = TTF_ANCHOR + """
          /// The bytes of the installed font file of the family `name` (its first face), for showing text in
          /// that font in the interface. `None` when no installed font has that family.
          pub fn family_bytes(name: &str) -> Option<Vec<u8>> {
              let mut g = lock();
              g.ensure_families();
              let stem = g.family_stems.get(&norm(name))?.clone();
              let bytes = g.file(&stem)?;
              Some(bytes.to_vec())
          }
          """
          edit("crates/fonts/src/ttf.rs", lambda s: once(s, TTF_ANCHOR, TTF_NEW, "installed_families"))

          # ---- crates/ui-egui/src/theme.rs: one egui font family per legacy Lao font ----------------------
          SET_FONTS = "    ctx.set_fonts(fonts);\n}"
          BLOCK = """    // Legacy-encoded Lao fonts (Alice_0, Alice_1, ...): the Latin keys carry Lao glyphs. Each gets a
              // family of its own, so the MTEXT box can show what is typed in the font chosen for it. The
              // interface faces follow in each family, for letters the legacy font lacks.
              {
                  let mut registered: Vec<String> = Vec::new();
                  for fam in cadcraft_fonts::ttf::installed_families() {
                      let low = fam.to_lowercase();
                      if !LEGACY_LAO_PREFIXES.iter().any(|p| low.starts_with(p)) {
                          continue;
                      }
                      let Some(bytes) = cadcraft_fonts::ttf::family_bytes(&fam).filter(|b| (b.len() as u64) <= MAX_UI_FONT_BYTES) else {
                          continue;
                      };
                      let key = format!("legacy-lao-{fam}");
                      fonts.font_data.insert(key.clone(), std::sync::Arc::new(egui::FontData::from_owned(bytes)));
                      let mut list = vec![key];
                      list.extend(fonts.families.get(&FontFamily::Proportional).cloned().unwrap_or_default());
                      fonts.families.insert(FontFamily::Name(fam.as_str().into()), list);
                      registered.push(fam);
                  }
                  *legacy_lao_registry().lock().unwrap_or_else(std::sync::PoisonError::into_inner) = registered;
              }

          """
          MONO = "pub fn mono() -> FontId {\n    FontId::new(12.0, FontFamily::Monospace)\n}\n"
          HELPERS = """
          /// Name prefixes (lower case) of the legacy-encoded Lao fonts, whose Latin keys carry Lao glyphs.
          /// Add the prefix of another such font here.
          const LEGACY_LAO_PREFIXES: &[&str] = &["alice"];

          fn legacy_lao_registry() -> &'static std::sync::Mutex<Vec<String>> {
              static REGISTRY: std::sync::OnceLock<std::sync::Mutex<Vec<String>>> = std::sync::OnceLock::new();
              REGISTRY.get_or_init(|| std::sync::Mutex::new(Vec::new()))
          }

          /// The egui font family that shows text as the font `name` itself, when `name` is a legacy-encoded
          /// Lao font installed on this machine (`install_fonts` makes one family per such font).
          pub(crate) fn legacy_lao_family(name: &str) -> Option<FontFamily> {
              let registry = legacy_lao_registry().lock().unwrap_or_else(std::sync::PoisonError::into_inner);
              registry.iter().find(|n| n.eq_ignore_ascii_case(name)).map(|n| FontFamily::Name(n.as_str().into()))
          }
          """


          def theme(s):
              s = once(s, SET_FONTS, BLOCK + SET_FONTS, "set_fonts")
              s = once(s, MONO, MONO + HELPERS, "mono")
              return s


          edit("crates/ui-egui/src/theme.rs", theme)

          # ---- crates/ui-egui/src/mtext_editor.rs: the text box uses that family ---------------------------
          OLD = "font_id: FontId::proportional(size),"
          NEW = """font_id: crate::theme::legacy_lao_family(f.font.as_deref().unwrap_or(fmt.base_font.as_str()))
                                  .map_or_else(|| FontId::proportional(size), |family| FontId::new(size, family)),"""
          edit("crates/ui-egui/src/mtext_editor.rs", lambda s: once(s, OLD, NEW, "layouter font_id"))
          print("legacy Lao fonts applied")
          PY_EOF
          if python legacy_edit.py; then
            touch .alice-applied
          else
            cp .pre-alice/ttf.rs crates/fonts/src/ttf.rs
            cp .pre-alice/theme.rs crates/ui-egui/src/theme.rs
            cp .pre-alice/mtext_editor.rs crates/ui-egui/src/mtext_editor.rs
            exit 1
          fi
          git diff --stat
      - name: Command line - caret, insert/erase inside the text, old text on TEXTEDIT
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .pre-caret
          cp crates/ui-egui/src/cmdline.rs .pre-caret/cmdline.rs
          cat > caret_edit.py <<'PY_EOF'
          import re, sys

          p = "crates/ui-egui/src/cmdline.rs"
          s = open(p, encoding="utf-8", newline="").read().replace("\r\n", "\n")


          def rx(anchor):
              return re.compile(r"\s+".join(re.escape(t) for t in anchor.split()))


          STRUCT = """pub buffer: String,
              /// The caret in `buffer` (a char index) and the text it was set for. When anything other than
              /// the editing keys changes the buffer, the caret goes to its end.
              caret: usize,
              caret_buf: String,
              /// The prompt (message and default) whose old text was already put in the line.
              prefilled: String,"""

          METHODS = """impl CmdLine {
              /// The caret as a char index into the buffer; at the end whenever something else changed the buffer.
              pub fn caret_at(&mut self) -> usize {
                  let n = self.buffer.chars().count();
                  if self.caret_buf != self.buffer {
                      self.caret = n;
                      self.caret_buf.clone_from(&self.buffer);
                  }
                  self.caret = self.caret.min(n);
                  self.caret
              }

              fn set_caret(&mut self, at: usize) {
                  self.caret = at.min(self.buffer.chars().count());
                  self.caret_buf.clone_from(&self.buffer);
              }

              /// Insert `s` at the caret (typing in the middle of the line).
              pub fn insert_at_caret(&mut self, s: &str) {
                  let at = self.caret_at();
                  let byte = self.buffer.char_indices().nth(at).map_or(self.buffer.len(), |(i, _)| i);
                  self.buffer.insert_str(byte, s);
                  self.set_caret(at + s.chars().count());
              }

              /// Erase the letter before the caret (`back`) or the one after it.
              pub fn erase_at_caret(&mut self, back: bool) {
                  let at = self.caret_at();
                  let Some(del) = (if back { at.checked_sub(1) } else { Some(at) }) else { return };
                  if let Some((i, c)) = self.buffer.char_indices().nth(del) {
                      self.buffer.replace_range(i..i + c.len_utf8(), "");
                      self.set_caret(del);
                  }
              }
          """

          KEYS = """Key::ArrowLeft if !modifiers.any() && !app.cmd.buffer.is_empty() => {
                              let at = app.cmd.caret_at();
                              app.cmd.set_caret(at.saturating_sub(1));
                          }
                          Key::ArrowRight if !modifiers.any() && !app.cmd.buffer.is_empty() => {
                              let at = app.cmd.caret_at();
                              app.cmd.set_caret(at + 1);
                          }
                          Key::Home if !app.cmd.buffer.is_empty() => app.cmd.set_caret(0),
                          Key::End if !app.cmd.buffer.is_empty() => {
                              let n = app.cmd.buffer.chars().count();
                              app.cmd.set_caret(n);
                          }
                          Key::Delete if !app.cmd.buffer.is_empty() => app.cmd.erase_at_caret(false),
                          Key::Tab => tab(app),"""

          PREFILL = """options_still_fit(app);

              // "Enter new text <old text>": start with the old text in the line, so letters can be inserted
              // or erased inside it (arrows, Home, End, Delete) instead of retyping all of it.
              let old_text = app
                  .session
                  .current_prompt()
                  .filter(|p| p.accept.text && !p.accept.point && !p.accept.number && !p.raw && p.message.starts_with("Enter new text"))
                  .and_then(|p| p.default.as_ref().map(ToString::to_string).filter(|d| !d.is_empty()).map(|d| format!("{}|{d}", p.message)));
              match old_text {
                  Some(key) => {
                      if app.cmd.prefilled != key {
                          if app.cmd.buffer.is_empty()
                              && let Some((_, d)) = key.split_once('|')
                          {
                              app.cmd.buffer = d.to_string();
                          }
                          app.cmd.prefilled = key;
                      }
                  }
                  None => {
                      if !app.session.prompting() {
                          app.cmd.prefilled.clear();
                      }
                  }
              }"""

          CARET_X = """let at = app.cmd.caret_at();
              let before: String = app.cmd.buffer.chars().take(at).collect();
              let mut caret_x = x + if before.len() == app.cmd.buffer.len() { gw } else { p.layout_no_wrap(before, font.clone(), t.text).size().x };"""

          edits = [
              ("pub buffer: String,", STRUCT),
              ("impl CmdLine {", METHODS),
              ("app.cmd.buffer.push_str(&t);", "app.cmd.insert_at_caret(&t);"),
              ("app.cmd.buffer.push_str(&text);", "app.cmd.insert_at_caret(&text);"),
              ("app.cmd.buffer.pop();", "app.cmd.erase_at_caret(true);"),
              ("Key::Tab => tab(app),", KEYS),
              ("options_still_fit(app);", PREFILL),
              ("let mut caret_x = x + gw;", CARET_X),
          ]
          for anchor, new in edits:
              n = len(rx(anchor).findall(s))
              if n != 1:
                  print(f"::warning::command-line caret NOT applied: '{anchor}' matched {n} times")
                  sys.exit(1)
          for anchor, new in edits:
              s = rx(anchor).sub(lambda m, new=new: new, s)
          open(p, "w", encoding="utf-8", newline="\n").write(s)
          print("command-line caret applied")
          PY_EOF
          if python caret_edit.py; then
            touch .caret-applied
          else
            cp .pre-caret/cmdline.rs crates/ui-egui/src/cmdline.rs
            exit 1
          fi
          git diff --stat
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test fonts crate
        continue-on-error: true
        run: cargo test -p cadcraft-fonts
      - name: Build
        shell: bash
        run: |
          try() { cargo build --release -p cadcraft 2>&1 | tee "$1"; }
          errors() {
            {
              echo "### $1: compile errors"
              echo '```'
              grep -A12 "^error" "$2" | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          if try build1.log; then echo "Build finished"; exit 0; fi
          if [ -f .caret-applied ]; then
            echo "::warning::The build WITH the command-line patch did not compile - building again WITHOUT it."
            errors "Command-line patch" build1.log
            cp .pre-caret/cmdline.rs crates/ui-egui/src/cmdline.rs
            rm -f .caret-applied
            if try build2.log; then echo "Build finished (without the command-line patch)"; exit 0; fi
          fi
          if [ -f .alice-applied ]; then
            echo "::warning::The build WITH the Alice font patch did not compile - building again WITHOUT it."
            errors "Alice patch" "$(ls -t build*.log | head -1)"
            cp .pre-alice/ttf.rs crates/fonts/src/ttf.rs
            cp .pre-alice/theme.rs crates/ui-egui/src/theme.rs
            cp .pre-alice/mtext_editor.rs crates/ui-egui/src/mtext_editor.rs
            rm -f .alice-applied
            if try build3.log; then echo "Build finished (without the Alice patch)"; exit 0; fi
          fi
          exit 1
      - name: What is in this build
        if: always()
        shell: bash
        run: |
          mkdir -p out
          if [ -f target/release/cadcraft.exe ]; then cp target/release/cadcraft.exe out/; fi
          has() { if grep -q "$1" "$2" 2>/dev/null; then echo yes; else echo NO; fi; }
          {
            echo "## What is in this build (v6 stable)"
            echo "- Lao shaping, tone marks, font list: $(has installed_families crates/fonts/src/ttf.rs)"
            echo "- Font dropdown in MTEXT: $(has font_choices crates/ui-egui/src/mtext_editor.rs)"
            echo "- Lao/Thai letters in the interface: $(has lao_thai_fonts crates/ui-egui/src/theme.rs)"
            echo "- Alice_0, Alice_1 ... shown in their own font: $(has legacy_lao_family crates/ui-egui/src/mtext_editor.rs)"
            echo "- Command line: caret, insert/erase inside the text: $(has insert_at_caret crates/ui-egui/src/cmdline.rs)"
          } | tee out/build-info.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-lao-v6-stable
          path: out/
  inplace:
    name: Experimental - in-place text editor (PR 2320)
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - name: Keep LF line endings (the patch has LF)
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream PR 2320 (in-place text editor)
        shell: bash
        run: |
          set +e
          git config user.email ci@example.invalid
          git config user.name ci
          if ! git fetch --no-tags https://github.com/storytold/cadcraft.git pull/2320/head:pr2320; then
            echo "fetch failed" > ../merge-status.txt
            echo "::error::could not fetch PR 2320"
            exit 1
          fi
          if git merge --no-edit pr2320 > ../merge1.log 2>&1; then
            echo "clean merge" > ../merge-status.txt
          else
            git diff --name-only --diff-filter=U > ../conflicts.txt
            {
              echo "### PR 2320: conflicts with this fork (taken from the PR)"
              sed 's/^/- /' ../conflicts.txt
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            if git merge --no-edit -X theirs pr2320 > ../merge2.log 2>&1; then
              echo "merged, conflicts resolved in favour of the PR" > ../merge-status.txt
            else
              git merge --abort
              echo "merge failed" > ../merge-status.txt
              echo "::error::PR 2320 cannot be merged into this fork"
              exit 1
            fi
          fi
          cat ../merge-status.txt
      - name: Apply Lao patch
        shell: bash
        run: |
          cat > lao.patch <<'PATCH_EOF'
          diff --git a/crates/fonts/src/complex.rs b/crates/fonts/src/complex.rs
          --- a/crates/fonts/src/complex.rs
          +++ b/crates/fonts/src/complex.rs
          @@ -23,9 +23,14 @@ use crate::{Shaped, bidi, stroke};
           const MAX_CHARS: usize = 10_000;
           
           /// Whether a line is laid out here rather than one glyph per character: it has right-to-left
          -/// text, or Thai (see the module notes).
          +/// text, Thai or Lao (see the module notes; Lao stacks vowels and tone marks like Thai).
           pub(crate) fn needed(s: &str) -> bool {
          -    s.chars().any(|c| bidi::is_rtl(c) || is_thai(c))
          +    s.chars().any(|c| bidi::is_rtl(c) || is_thai(c) || is_lao(c))
          +}
          +
          +/// Whether `c` is in the Lao block.
          +pub(crate) fn is_lao(c: char) -> bool {
          +    matches!(c, '\u{0E80}'..='\u{0EFF}')
           }
           
           /// Whether `c` is in the Thai block.
          @@ -231,7 +236,8 @@ fn shape_run(face: &Face, cs: &[char], r: Range<usize>, rtl: bool) -> Vec<Glyph>
                   return Vec::new();
               }
               let k = 1000.0 / f64::from(shaper.units_per_em().max(1));
          -    buf.glyph_infos()
          +    let mut glyphs: Vec<Glyph> = buf
          +        .glyph_infos()
                   .iter()
                   .zip(buf.glyph_positions())
                   .map(|(gi, gp)| Glyph {
          @@ -241,7 +247,52 @@ fn shape_run(face: &Face, cs: &[char], r: Range<usize>, rtl: bool) -> Vec<Glyph>
                       dx: f64::from(gp.x_offset) * k,
                       dy: f64::from(gp.y_offset) * k,
                   })
          -        .collect()
          +        .collect();
          +    // Only acts on Lao tone marks that sit on an upper vowel; any other text is left untouched.
          +    raise_lao_tone_marks(face, &mut glyphs);
          +    glyphs
          +}
          +
          +/// Gap kept between a Lao upper vowel and the tone mark above it, in font units (1000 per em).
