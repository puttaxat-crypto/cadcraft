name: Build Windows LAO v6
run-name: "LAO v6: ${{ github.event.head_commit.message }}"

# Applies the Lao patch to the checked-out source in CI, tests the fonts crate and
# builds cadcraft.exe. The patch is NOT committed; nothing in the repo changes.
# v6 = v5 + command-line editing (caret, arrows, Home/End/Delete; TEXTEDIT starts with the old text).
# v6 builds TWO exes in parallel:
#   stable  = v4 (Lao shaping, font dropdowns in Text Style and MTEXT, Lao/Thai letters in the UI,
#             legacy Alice fonts) - artifact cadcraft-windows-lao-v6-stable
#   inplace = stable + upstream PR #2320 (in-place text editor: double-click existing text and
#             insert / delete letters instead of retyping) - artifact cadcraft-windows-lao-v6-inplace.
#             EXPERIMENTAL: if it cannot merge or compile, the run summary says why; stable is unaffected.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-lao-v6.yml"

jobs:
  stable:
    name: Stable (v4 features)
    runs-on: windows-latest
    steps:
      - name: Keep LF line endings (the patch has LF)
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Apply Lao patch
        shell: bash
        run: |
          set -e
          cat > lao.patch <<'PATCH_EOF'
