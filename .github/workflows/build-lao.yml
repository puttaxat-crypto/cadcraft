          +        if name.is_empty() || name.starts_with('@') {
          +            continue;
          +        }
          +        let rank = (if id == 16 { 0 } else { 10 }) + if platform == 3 && language == 0x409 { 0 } else if platform == 3 { 1 } else { 2 };
          +        if best.as_ref().is_none_or(|(r, _)| rank < *r) {
          +            best = Some((rank, name));
          +        }
          +    }
          +    best.map(|(_, n)| n)
          +}
          +
          +/// One record of a `name` table at `at`: platform, language, name id and the raw string.
          +fn name_record(table: &[u8], base: usize, at: usize) -> Option<(u16, u16, u16, &[u8])> {
          +    let platform = be16(table, at)?;
          +    let language = be16(table, at.checked_add(4)?)?;
