name: Build Windows (Lao patch)

# Applies the Lao patch to the checked-out source in CI, tests the fonts crate and
# builds cadcraft.exe. The patch is NOT committed; nothing in the repo changes.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-lao.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Keep LF line endings (the patch has LF)
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Apply Lao patch
        shell: bash
        run: |
          set -e
          cat > lao.patch <<'PATCH_EOF'
          diff --git a/crates/fonts/src/complex.rs b/crates/fonts/src/complex.rs
