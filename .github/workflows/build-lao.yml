          @@ -231,7 +236,8 @@ fn shape_run(face: &Face, cs: &[char], r: Range<usize>, rtl: bool) -> Vec<Glyph>
                   return Vec::new();
               }
               let k = 1000.0 / f64::from(shaper.units_per_em().max(1));
          -    buf.glyph_infos()
          +    let mut glyphs: Vec<Glyph> = buf
          +        .glyph_infos()
                   .iter()
                   .zip(buf.glyph_positions())
                   .map(|(gi, gp)| Glyph {
          @@ -241,7 +247,52 @@ fn shape_run(face: &Face, cs: &[char], r: Range<usize>, rtl: bool) -> Vec<Glyph>
                       dx: f64::from(gp.x_offset) * k,
                       dy: f64::from(gp.y_offset) * k,
                   })
          -        .collect()
          +        .collect();
          +    // Only acts on Lao tone marks that sit on an upper vowel; any other text is left untouched.
          +    raise_lao_tone_marks(face, &mut glyphs);
          +    glyphs
          +}
          +
          +/// Gap kept between a Lao upper vowel and the tone mark above it, in font units (1000 per em).
          +const LAO_MARK_GAP: f64 = 30.0;
          +
          +/// Bottom and top of a placed glyph (outline plus its vertical offset), in font units.
          +fn glyph_extent(face: &Face, g: &Glyph) -> (f64, f64) {
          +    let outline = ttf::glyph_by_id(face, g.gid);
          +    let (lo, hi) = outline.contours.iter().flatten().fold((f64::INFINITY, f64::NEG_INFINITY), |(lo, hi), p| (lo.min(p.y), hi.max(p.y)));
          +    (lo + g.dy, hi + g.dy)
          +}
          +
          +/// A Lao tone mark (ໄມ້ເອກ ໄມ້ໂທ ...) goes above an upper vowel (ິ ີ ຶ ື ັ ົ ໍ) on the same letter. Fonts
          +/// without mark-to-mark positioning for Lao leave both marks at one height, so a tone mark that
          +/// overlaps the vowel under it is raised to just above it. A font that already stacks them is
          +/// left alone: its tone mark is already above the vowel, so nothing is raised.
          +fn raise_lao_tone_marks(face: &Face, glyphs: &mut [Glyph]) {
          +    const UPPER_VOWELS: [char; 7] = ['\u{0EB1}', '\u{0EB4}', '\u{0EB5}', '\u{0EB6}', '\u{0EB7}', '\u{0EBB}', '\u{0ECD}'];
          +    const TONES: [char; 5] = ['\u{0EC8}', '\u{0EC9}', '\u{0ECA}', '\u{0ECB}', '\u{0ECC}'];
          +    let vowels = face.glyph_ids(&UPPER_VOWELS);
          +    let tones = face.glyph_ids(&TONES);
          +    // Glyph 0 is .notdef (a font without Lao): never treat it as a vowel or a tone mark.
          +    let is_in = |set: &[Option<u32>], gid: u32| gid != 0 && set.contains(&Some(gid));
          +    if !glyphs.iter().any(|g| is_in(&tones, g.gid)) || !glyphs.iter().any(|g| is_in(&vowels, g.gid)) {
          +        return;
          +    }
          +    // A letter is a glyph with an advance and the zero-advance marks after it.
          +    let mut start = 0;
          +    while start < glyphs.len() {
          +        let end = glyphs.iter().skip(start + 1).position(|g| g.advance.abs() > 0.5).map_or(glyphs.len(), |n| start + 1 + n);
          +        let Some(group) = glyphs.get_mut(start..end) else { break };
          +        let top = group.iter().filter(|g| is_in(&vowels, g.gid)).map(|g| glyph_extent(face, g).1).fold(f64::NEG_INFINITY, f64::max);
          +        if top.is_finite() {
          +            for g in group.iter_mut().filter(|g| is_in(&tones, g.gid)) {
          +                let need = top + LAO_MARK_GAP - glyph_extent(face, g).0;
          +                if need.is_finite() && need > 0.0 {
          +                    g.dy += need;
          +                }
          +            }
          +        }
          +        start = end;
          +    }
           }
           
